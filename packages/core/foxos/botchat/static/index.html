<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能体 · 狐狸OS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <span class="brand-mark"><img src="favicon.svg" alt=""></span>
      <div class="brand-text"><b data-i18n="app.title">智能体</b><small data-i18n="app.subtitle">狐狸OS</small></div>
      <button id="btn-dock" class="icon-btn" data-i18n-title="app.dock_toggle"><i class="ti ti-layout-sidebar-right"></i></button>
    </div>
    <button id="btn-new-bot" class="btn primary wide"><i class="ti ti-plus"></i><span data-i18n="bots.new">新建智能体</span></button>
    <div class="search"><i class="ti ti-search"></i><input id="bot-search" data-i18n-placeholder="bots.search" placeholder="搜索智能体"></div>
    <div class="side-label"><span data-i18n="bots.list">智能体</span><span id="bot-count"></span></div>
    <div id="bot-list" class="bot-list scroll"></div>
    <nav class="side-nav">
      <button class="nav-item" data-view="approvals"><i class="ti ti-shield-check"></i><span data-i18n="nav.approvals">审批</span><b id="badge-approvals" class="badge hidden">0</b></button>
      <button class="nav-item" data-view="connectors"><i class="ti ti-plug-connected"></i><span data-i18n="nav.connectors">连接器</span></button>
      <button class="nav-item" data-view="agents"><i class="ti ti-terminal-2"></i><span data-i18n="nav.agents">代码智能体</span></button>
      <button class="nav-item" data-view="machines"><i class="ti ti-devices-pc"></i><span data-i18n="nav.machines">机器</span></button>
      <button class="nav-item" data-view="skills"><i class="ti ti-books"></i><span data-i18n="nav.skills">技能</span></button>
      <button class="nav-item" data-view="routines"><i class="ti ti-repeat"></i><span data-i18n="nav.routines">例程</span></button>
      <button class="nav-item" data-view="runtime"><i class="ti ti-stack-2"></i><span data-i18n="nav.runtime">运行环境</span></button>
    </nav>
    <div class="side-foot">
      <button id="btn-takeover" class="btn danger wide"><i class="ti ti-hand-stop"></i><span data-i18n="control.take_over">人工接管</span></button>
      <div class="foot-row">
        <select id="lang" class="mini-select" data-i18n-title="app.language"><option value="zh-CN">中文</option><option value="en-US">English</option></select>
        <button id="btn-theme" class="icon-btn" data-i18n-title="app.theme"><i class="ti ti-device-desktop"></i></button>
        <span class="grow"></span>
        <span id="conn-state" class="conn" data-i18n-title="app.connected"></span>
      </div>
    </div>
  </aside>
  <main id="main" class="main">
    <div id="acting" class="acting hidden"></div>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>
<script src="app.js"></script>
</body>
</html>
