[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foxos"
version = "0.3.2"
description = "狐狸OS（FoxOS）统一命令内核与 foxos CLI"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "zstandard>=0.22"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
foxos = "foxos.cli:main"

[tool.setuptools.packages.find]
include = ["foxos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
