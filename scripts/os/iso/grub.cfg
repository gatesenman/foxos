# 狐狸OS Live ISO 引导菜单（UEFI 与 BIOS 共用）
set timeout=8
set default=0
set menu_color_normal=white/black
set menu_color_highlight=black/light-magenta

if loadfont unicode ; then
  set gfxmode=auto
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi

# 不要传 splash：initramfs 里没有完整的 plymouth（没有主题就没有 plymouthd）。
# console=ttyS0 方便在 QEMU 测试时抓串口日志；真实机器上无害。
menuentry "狐狸OS（试用或安装）" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper hostname=foxos username=foxos live-config.username=foxos locale=zh_CN.UTF-8 timezone=Asia/Shanghai keyboard-configuration/layoutcode=us console=tty0 console=ttyS0,115200n8 quiet ---
    initrd /casper/initrd
}
menuentry "狐狸OS（试用或安装，English）" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper hostname=foxos username=foxos locale=en_US.UTF-8 timezone=UTC console=tty0 console=ttyS0,115200n8 quiet ---
    initrd /casper/initrd
}
menuentry "狐狸OS（安全模式，文本启动日志）" {
    linux /casper/vmlinuz boot=casper hostname=foxos username=foxos locale=zh_CN.UTF-8 timezone=Asia/Shanghai console=tty0 console=ttyS0,115200n8 nosplash debug ---
    initrd /casper/initrd
}
