# 狐狸OS Live ISO 引导菜单（UEFI 与 BIOS 共用）
set timeout=8
set default=0
set menu_color_normal=white/black
set menu_color_highlight=black/light-magenta

if loadfont unicode ; then
  set gfxmode=auto
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi

menuentry "狐狸OS（试用或安装）" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper hostname=foxos username=foxos live-config.username=foxos locale=zh_CN.UTF-8 timezone=Asia/Shanghai keyboard-configuration/layoutcode=cn quiet splash ---
    initrd /casper/initrd
}
menuentry "狐狸OS（试用或安装，English）" {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper hostname=foxos username=foxos locale=en_US.UTF-8 timezone=UTC quiet splash ---
    initrd /casper/initrd
}
menuentry "狐狸OS（安全模式，文本启动日志）" {
    linux /casper/vmlinuz boot=casper hostname=foxos username=foxos locale=zh_CN.UTF-8 nosplash debug ---
    initrd /casper/initrd
}
