# 狐狸OS 安装器（Calamares）主配置。默认中文界面由 branding + locale 模块决定。
modules-search:
  - local
  - /usr/lib/x86_64-linux-gnu/calamares/modules
  - /usr/lib/calamares/modules
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - initramfs
      - umount
  - show:
      - finished
branding: foxos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
