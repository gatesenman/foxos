# Live 会话里同意过 Google Chrome 条款并装了 Chrome，就把 Chrome 从 Google 官方源装进新系统。
# 没同意 / 没网：跳过，新系统首次登录时再询问。失败不影响安装。
---
dontChroot: true
timeout: 900
script:
  - command: "-/usr/lib/foxos/foxos-chrome-setup --if-accepted ${ROOT}"
    timeout: 900
i18n:
  name: "Install Google Chrome (if accepted)"
  name[zh_CN]: "安装 Google Chrome（如已同意条款）"
