# 狐狸OS 安装器分区设置（Calamares 3.3）。
# 必须显式写 partitionLayout：没有这个文件时 Calamares 3.3.5「抹掉磁盘」只建 EFI 分区、不建根分区，
# 系统会被拷进现场会话的内存里，装完的磁盘起不来（0.3.3 ISO 端到端安装测试发现）。
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 300MiB
  minimumSize: 32MiB
  label: "EFI"
userSwapChoices:
  - none
  - file
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
defaultPartitionTableType: gpt
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
partitionLayout:
  - name: "rootfs"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
