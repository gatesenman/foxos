# 狐狸OS 安装器挂载设置（Calamares 3.3）。
# 必须有 extraMounts：没有这个文件时目标系统里没有 /dev /proc /sys，
# grub-install 报「cannot find a device for /boot/efi (is /dev mounted?)」，安装失败（0.3.3 ISO 端到端安装测试发现）。
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
