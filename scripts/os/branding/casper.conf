# Live 会话用户（casper 启动时创建）
USERNAME="foxos"
USERFULLNAME="狐狸OS"
HOST="foxos"
# BUILD_SYSTEM 必须是 Ubuntu 或 Debian。casper-helpers 用它决定 MP_QUIET；
# 写成其它值时，`modprobe "" -b overlay` 会失败，出现
# “/cow format specified as 'overlay' and no support found”，进不了桌面。
# 产品名请用 FLAVOUR / USERFULLNAME，不要改这个字段。
BUILD_SYSTEM="Ubuntu"
FLAVOUR="FoxOS"
